name: Release verification
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published companion tag (for example v0.2.4)
        required: true
        default: v0.2.4
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify published bytes and tag identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/verify-release.py --tag "$RELEASE_TAG" --output artifacts/release-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-integrity
          path: artifacts/release-verification.json
          if-no-files-found: error
