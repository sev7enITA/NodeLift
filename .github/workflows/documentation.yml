name: Documentation checks
on:
  push:
    # Source tags can precede final GitHub publication timestamps.
    # Full publication consistency is checked on branches and pull requests.
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release-history.py --check
      - run: python scripts/check-docs.py
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/doctor.py --json
