name: NodeLift
options:
  developmentLanguage: en
  knownRegions: [en, zh-Hans, it]
  bundleIdPrefix: dev.nodelift
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
targets:
  NodeLift:
    type: application
    platform: iOS
    sources: [NodeLift]
    info:
      path: NodeLift/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: dev.nodelift.pairing
            CFBundleURLSchemes: [nodelift]
        NSCameraUsageDescription: Scan the pairing QR code shown by NodeLift on your computer.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    dependencies:
      - framework: ../../native/build/iphoneos/lib/nodelift.framework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nodelift.companion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.2.7
        CURRENT_PROJECT_VERSION: 9
        SWIFT_OBJC_BRIDGING_HEADER: NodeLift/Bridge.h
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NodeLift
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: NodeLift connects to your computer to measure network and device capabilities.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
schemes:
  NodeLift:
    build:
      targets:
        NodeLift: all
