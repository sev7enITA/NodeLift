name: NodeLift
options:
  developmentLanguage: en
  knownRegions: [en, zh-Hans, it]
  bundleIdPrefix: dev.nodelift
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
targets:
  NodeLift:
    type: application
    platform: iOS
    sources: [NodeLift]
    dependencies:
      - framework: ../../native/build/iphoneos/lib/nodelift.framework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nodelift.companion
        MARKETING_VERSION: 0.2.3
        CURRENT_PROJECT_VERSION: 5
        SWIFT_OBJC_BRIDGING_HEADER: NodeLift/Bridge.h
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NodeLift
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: NodeLift connects to your computer to measure network and device capabilities.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
schemes:
  NodeLift:
    build:
      targets:
        NodeLift: all
