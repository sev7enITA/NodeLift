name: NodeLift
options:
  bundleIdPrefix: dev.nodelift
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
targets:
  NodeLift:
    type: application
    platform: iOS
    sources: [NodeLift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nodelift.companion
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NodeLift
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: NodeLift si collega al tuo computer per misurare rete e capacità del dispositivo.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
schemes:
  NodeLift:
    build:
      targets:
        NodeLift: all
