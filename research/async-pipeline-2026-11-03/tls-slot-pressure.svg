   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(238.336875 414.568617)">One physical Xiaomi 0.2.13 diagnostic with an 8B target and 1B draft.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(178.815938 425.371078)">43 proposed draft tokens were accepted before a later lease expired and the host used fallback.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(151.353281 436.173539)">Concurrent socket sampling changes the workload: these timings are diagnostic, not performance evidence.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(181.899141 446.976)">The host connection-lifetime correction passes local tests; a post-fix phone run is still required.</text>
